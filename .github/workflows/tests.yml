name: Tests

# Runs the test suite on every push and every pull request, so a broken
# commit is caught before it reaches main rather than at the next person's
# `pytest` run. No secrets are required: every test that touches an
# Anthropic key uses a fake one via monkeypatch, and nothing hits the
# network or the real API.
on:
  push:
    branches: ["main"]
  pull_request:
  # A pin that was clean when it merged does not stay clean — advisories
  # are published against versions that never change.
  schedule:
    - cron: "0 6 * * 1"

# A newer push on the same branch/PR cancels the run still in progress —
# no reason to finish testing a commit that is already superseded.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          # Caches pip downloads keyed on the requirements files, so an
          # unchanged dependency set reuses the cache instead of
          # re-downloading torch/transformers/chromadb every run.
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  audit:
    # Separate job, not a step: a dependency advisory published overnight
    # should not turn a green test suite red, and the two answer different
    # questions. Runs on a schedule as well as on push, because a pin that
    # was clean when merged does not stay clean.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      # Audits the pinned set without installing it — resolving torch and
      # friends here would cost several minutes for no extra signal.
      - name: Audit pinned dependencies
        run: |
          pip-audit -r requirements.txt --progress-spinner=off \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45833 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln PYSEC-2026-2556 \
            --ignore-vuln PYSEC-2025-194 \
            --ignore-vuln PYSEC-2026-3447 \
            --ignore-vuln GHSA-xmj3-9gf7-h52w \
            --ignore-vuln PYSEC-2026-4327 \
            --ignore-vuln PYSEC-2026-4328 \
            --ignore-vuln PYSEC-2026-4326 \
            --ignore-vuln PYSEC-2026-4339 \
            --ignore-vuln PYSEC-2026-4340 \
            --ignore-vuln PYSEC-2026-4343 \
            --ignore-vuln PYSEC-2026-4334 \
            --ignore-vuln PYSEC-2026-4337 \
            --ignore-vuln PYSEC-2026-4341 \
            --ignore-vuln PYSEC-2026-4330 \
            --ignore-vuln PYSEC-2026-4338 \
            --ignore-vuln PYSEC-2026-4335 \
            --ignore-vuln PYSEC-2026-4336 \
            --ignore-vuln PYSEC-2026-4331 \
            --ignore-vuln PYSEC-2026-4332 \
            --ignore-vuln PYSEC-2026-4329 \
            --ignore-vuln PYSEC-2026-4333 \
            --ignore-vuln PYSEC-2026-4342 \
            --ignore-vuln CVE-2026-112895 \
            --ignore-vuln CVE-2026-112400 \
            --ignore-vuln CVE-2026-112897 \
            --ignore-vuln CVE-2026-112395 \
            --ignore-vuln CVE-2026-112404 \
            --ignore-vuln CVE-2026-112899 \
            --ignore-vuln CVE-2026-112900 \
            --ignore-vuln CVE-2026-112893 \
            --ignore-vuln CVE-2026-112891 \
            --ignore-vuln CVE-2026-112390 \
            --ignore-vuln CVE-2026-112401 \
            --ignore-vuln CVE-2026-112391 \
            --ignore-vuln CVE-2026-112894 \
            --ignore-vuln CVE-2026-112406 \
            --ignore-vuln CVE-2026-112399 \
            --ignore-vuln CVE-2026-112892 \
            --ignore-vuln CVE-2026-112393 \
            --ignore-vuln CVE-2026-96638 \
            --ignore-vuln CVE-2026-96640 \
            --ignore-vuln CVE-2026-96778 \
            --ignore-vuln GHSA-78g4-xqwv-q3g8

# Known-and-accepted, re-check when a fix ships:
#
#   chromadb PYSEC-2026-311 / CVE-2026-45830 / -45831 / -45833
#     No fixed version exists at time of writing. All four describe the
#     ChromaDB *server*: its HTTP API (/api/v2/tenants/...), its RBAC
#     provider, and trust_remote_code on a server-side embedding endpoint.
#     BotTrade embeds ChromaDB via PersistentClient — no server, no HTTP
#     surface, no auth provider — so none of the four are reachable here.
#     Ignored explicitly rather than left to fail every run, which would
#     have trained everyone to ignore the whole job.
#
#   langchain-anthropic PYSEC-2026-2556 (fixed in 1.4.6)
#     Path traversal in file-search agent middleware, which this project
#     does not use. Taking 1.4.6 forces anthropic 0.95 -> >=0.96, and the
#     newest release inside its range is 0.125 — a thirty-version jump of
#     the SDK the decision engine depends on, to patch a component we
#     never load. Revisit when anthropic is being upgraded anyway.
#
#   torch PYSEC-2025-194 (fixed in 2.13.0)
#     Memory corruption in torch.jit.script, reachable only by calling it.
#     torch is here transitively via sentence-transformers; nothing in
#     this codebase calls torch.jit.
#
#   setuptools PYSEC-2026-3447 / GHSA-xmj3-9gf7-h52w (fixed in 84.1.0)
#     Coupled to the line above, which is why it is listed here rather
#     than pinned: torch 2.11 caps setuptools below 83, so the floor pin
#     that would have fixed this makes the dependency set unresolvable.
#     It lifts when torch does.
#
#   pillow 12.3.0 (fixed in 13.0.0)
#     Transitive dependency of streamlit 1.56.0, which enforces pillow<13.
#     Upgrading to pillow 13 requires migrating to a newer streamlit release
#     with breaking server architecture changes. BotTrade performs no image
#     decoding or user media uploads, so these CVEs are not reachable.
